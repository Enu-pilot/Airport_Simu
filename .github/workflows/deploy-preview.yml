name: Vercel Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened]

# 同じPRへの連続プッシュでは古い実行をキャンセルし、最新コミットだけデプロイする
concurrency:
  group: vercel-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # 文書のみのPRではデプロイしない（deployment 自体を作らないので
  # Vercel Hobby の deployment rate limit を消費しない）
  changes:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the app changed
        id: check
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "Changed files:"
          echo "$files"
          # *.md / docs/** / .github/** 以外の変更が1つでもあればデプロイする
          if echo "$files" | grep -qvE '\.md$|^docs/|^\.github/'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change: skipping preview deployment."
          fi

  deploy:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $url"
      - name: Comment Preview URL on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "Preview deployment: $PREVIEW_URL (commit ${{ github.event.pull_request.head.sha }})"
